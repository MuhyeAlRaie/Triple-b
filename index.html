<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple-B Restaurant Menu</title>
    <meta name="description" content="TRiPLE-B restaurant menu - Smash burgers, chicken burgers, appetizers, sides, sauces and beverages. Browse nutrition facts, allergens and details.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header with restaurant info -->
        <header class="restaurant-header">
            <div class="cover-image-container">
                <img id="cover-image" src="assets/images/cover-tb.jpg" alt="Restaurant Cover">
            </div>
            <div class="restaurant-info">
                <img id="logo" src="assets/images/logo-iiib.png" alt="Restaurant Logo" class="logo">
                <h1 id="restaurant-name">TRiPLE-B</h1>
                <a id="instagram-link" href="https://www.instagram.com/tripleb.sa/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a id="google-reviews-link" href="https://maps.app.goo.gl/a1b4ZJcTX9NPvVgR7?g_st=ic" target="_blank" rel="noopener noreferrer" aria-label="Google Reviews">
                    <i class="fab fa-google"></i>
                </a>
            </div>
            <div class="language-toggle">
                <button id="lang-toggle" class="btn" type="button">العربية</button>
            </div>
        </header>

        <!-- Categories -->
        <div id="categories-container" class="categories-container"></div>

        <!-- Menu Items Container -->
        <main class="menu-container">
            <div id="menu-items" class="menu-items-grid"></div>
        </main>
    </div>

    <!-- Item Detail Modal (Bootstrap Modal, custom dark theme) -->
    <div class="modal fade" id="item-modal" tabindex="-1" aria-labelledby="modal-item-name" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable item-modal-dialog">
            <div class="modal-content item-modal-content">
                <span class="close" data-bs-dismiss="modal" aria-label="Close">&times;</span>
                <div class="modal-body">
                    <img id="modal-item-image" src="" alt="Item Image">
                    <h2 id="modal-item-name"></h2>
                    <div class="item-price" id="modal-item-price"></div>
                    <div class="item-details">
                        <div class="item-calories" id="modal-item-calories"></div>
                        <div class="item-allergens" id="modal-item-allergens"></div>
                        <div class="item-ingredients" id="modal-item-ingredients"></div>
                        <div class="item-nutrition-container">
                            <h3 id="nutrition-title">Nutrition Information</h3>
                            <div class="nutrition-grid" id="nutrition-grid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Allergen Warning Section -->
    <div class="allergen-warning">
        <div id="allergen-text" class="allergen-text"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div id="vortishop-text" class="vortishop-text">Powered by </div>
            <div class="vortishop-logo">
                <a href="https://www.vortishop.com" target="_blank" rel="noopener noreferrer">
                    <img src="assets/images/vortishop-logo.png" alt="Vortishop Logo">
                </a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Menu data (edit this file to change the menu) -->
    <script src="assets/js/data.js"></script>
    <!-- App logic -->
    <script src="assets/js/main.js"></script>
</body>
</html>
